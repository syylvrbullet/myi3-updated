# BEGIN_KITTY_THEME
# Catppuccin Mocha Theme
include /home/fox/.config/kitty/themes/mocha.conf
# Moonfly Theme
#include /home/fox/.config/kitty/themes/moonfly.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="UbuntuMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_Tab_Config
tab_bar_edge top
tab_bar_style powerline
active_tab_background #b4befe
# END_Tab_Config

# BEGIN_Keybinds
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+0 goto_tab 10
map ctrl+shift+left no_op
map ctrl+shift+right no_op
map ctrl+shift+home no_op
map ctrl+shift+end no_op
# END_Keybinds

# Color scheme
background_opacity 0.8
background_blur 10

#Bell Sound
#enable_audio_bell no
#command_on_bell pw-play /home/fox/.config/sounds/byep.mp3 

# Config
confirm_os_window_close 0
